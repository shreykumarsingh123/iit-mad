<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Student Results | IIT Madras</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
      background: #fff;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; }
    button, input { font: inherit; }
    .page { width: min(100% - 48px, 1120px); margin: 0 auto; }
    .masthead {
      display: flex;
      min-height: 228px;
      align-items: center;
      gap: 18px;
      border-bottom: 1px solid #d6d6d6;
    }
    .logo { width: 190px; height: 190px; flex: 0 0 auto; object-fit: contain; }
    .institution { margin: 0; font-size: clamp(27px, 4vw, 42px); font-weight: 700; line-height: 1.15; }
    .institution-subtitle { margin: 11px 0 0; font-size: 18px; font-weight: 700; }
    main { width: min(100%, 460px); margin: 54px auto 0; }
    h1 { margin: 0; font-size: 30px; line-height: 1.2; }
    .intro { margin: 10px 0 30px; color: #515151; font-size: 15px; line-height: 1.5; }
    .field { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-size: 15px; font-weight: 700; }
    input {
      width: 100%;
      height: 50px;
      padding: 0 13px;
      border: 1px solid #777;
      border-radius: 2px;
      color: #111;
      background: #fff;
    }
    input:focus { border-color: #8b2635; outline: 2px solid #8b263533; outline-offset: 1px; }
    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 66px; }
    .reveal {
      position: absolute;
      top: 0;
      right: 6px;
      height: 50px;
      padding: 0 8px;
      border: 0;
      color: #6d1f2c;
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }
    .submit {
      width: 100%;
      min-height: 50px;
      margin-top: 2px;
      border: 0;
      border-radius: 2px;
      color: #fff;
      background: #7c2432;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
    }
    .submit:hover { background: #5e1a26; }
    .submit:focus-visible, .reveal:focus-visible { outline: 3px solid #bd8b38; outline-offset: 2px; }
    .message { min-height: 22px; margin: 0 0 12px; font-size: 13px; line-height: 1.5; }
    .message.error { color: #a21e2b; }
    .message.success { color: #285e38; }
    .result-view { width: min(100%, 1000px); margin: 42px auto 0; }
    .result-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    .result-toolbar h1 { font-size: 25px; }
    .result-actions { display: flex; gap: 10px; }
    .result-action {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border: 1px solid #7c2432;
      border-radius: 2px;
      color: #7c2432;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }
    .result-action.primary { color: #fff; background: #7c2432; }
    .result-action:hover { border-color: #5e1a26; color: #5e1a26; }
    .result-action.primary:hover { color: #fff; background: #5e1a26; }
    #result-pdf { display: block; width: 100%; height: min(78vh, 900px); min-height: 480px; border: 1px solid #d6d6d6; }
    .notice {
      margin-top: 26px;
      padding-top: 15px;
      border-top: 1px solid #d6d6d6;
      color: #555;
      font-size: 12px;
      line-height: 1.6;
    }
    footer { margin: 60px auto 20px; color: #666; text-align: center; font-size: 11px; }
    @media (max-width: 600px) {
      .page { width: min(100% - 32px, 1120px); }
      .masthead { min-height: 148px; gap: 12px; }
      .logo { width: 108px; height: 108px; }
      .institution { font-size: clamp(22px, 6vw, 30px); }
      .institution-subtitle { margin-top: 7px; font-size: 14px; }
      main { margin-top: 38px; }
      h1 { font-size: 27px; }
      .result-view { margin-top: 28px; }
      .result-toolbar { align-items: flex-start; flex-direction: column; }
      .result-actions { width: 100%; }
      .result-action { flex: 1; }
      #result-pdf { height: 72vh; min-height: 420px; }
      footer { margin-top: 42px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <img class="logo" src="https://www.iitm.ac.in/themes/custom/iitm/assets/images/iitm_logo.png" alt="IIT Madras logo">
      <div>
        <p class="institution">Indian Institute of Technology Madras</p>
        <p class="institution-subtitle">Student Results Portal</p>
      </div>
    </header>
    <main id="login-view">
      <h1>Sign in</h1>
      <p class="intro">Enter your student credentials to access your result.</p>
      <form id="login-form">
        <div class="field">
          <label for="student-id">Student ID</label>
          <input id="student-id" name="student-id" autocomplete="username" placeholder="Enter your student ID" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
            <button class="reveal" type="button" id="toggle-password" aria-label="Show password">Show</button>
          </div>
        </div>
        <p class="message" id="login-message" role="status" aria-live="polite"></p>
        <button class="submit" type="submit">Sign in</button>
      </form>
      <p class="notice">IIT Madras.</p>
    </main>
    <section class="result-view" id="result-view" aria-labelledby="result-heading" hidden>
      <div class="result-toolbar">
        <h1 id="result-heading" tabindex="-1">Your Result</h1>
        <div class="result-actions">
          <button class="result-action" id="back-button" type="button">Back</button>
          <a class="result-action primary" href="./IIT%20MADRAS%20RESULT.pdf" download="IIT MADRAS RESULT.pdf">Download PDF</a>
        </div>
      </div>
      <iframe id="result-pdf" title="IIT Madras result PDF"></iframe>
    </section>
    <footer>IIT Madras. All rights reserved.</footer>
  </div>
  <script>
    const studentIdForDemo = "23F1002716";
    const passwordForDemo = "30072005";
    const resultPdfUrl = "./IIT%20MADRAS%20RESULT.pdf";
    const loginForm = document.querySelector("#login-form");
    const message = document.querySelector("#login-message");
    const loginView = document.querySelector("#login-view");
    const resultView = document.querySelector("#result-view");

    document.querySelector("#toggle-password").addEventListener("click", (event) => {
      const passwordInput = document.querySelector("#password");
      const isHidden = passwordInput.type === "password";
      passwordInput.type = isHidden ? "text" : "password";
      event.currentTarget.textContent = isHidden ? "Hide" : "Show";
      event.currentTarget.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
    });

    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const enteredStudentId = document.querySelector("#student-id").value.trim();
      const enteredPassword = document.querySelector("#password").value;
      const authenticated = enteredStudentId === studentIdForDemo && enteredPassword === passwordForDemo;
      if (authenticated) {
        loginView.hidden = true;
        resultView.hidden = false;
        document.querySelector("#result-pdf").src = resultPdfUrl;
        document.querySelector("#result-heading").focus({ preventScroll: true });
        window.scrollTo({ top: 0, behavior: "smooth" });
        return;
      }
      message.className = "message error";
      message.textContent = "Student ID or password is incorrect.";
    });

    document.querySelector("#back-button").addEventListener("click", () => {
      resultView.hidden = true;
      loginView.hidden = false;
      document.querySelector("#student-id").focus();
    });
  </script>
</body>
</html>
